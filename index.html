<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a24" />
  <meta name="description" content="Huyền My Luận Giải - soi mình qua thần số học, chiêm tinh và ngũ hành, cùng một người đồng hành biết lắng nghe." />
  <title>Huyền My Luận Giải</title>
  <link rel="icon" type="image/svg+xml" href="/art/huyenmy-avatar.svg" />
  <meta name="author" content="Lương Việt Hoàng" />
  <meta name="copyright" content="© 2026 Lương Việt Hoàng." />
  <meta property="og:title" content="Huyền My Luận Giải" />
  <meta property="og:description" content="Soi mình qua thần số, tinh tượng và ngũ hành cùng Huyền My." />
  <meta property="og:image" content="/art/huyenmy-og.png" />
  <link rel="preload" href="/fonts/be-vietnam-pro-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/literata-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/cormorant-garamond-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/fonts/fonts.css" />
</head>
<body class="veil-on">
  <canvas id="stage" aria-hidden="true"></canvas>
  <div id="stage-area"><svg id="wheel"></svg><div id="char" role="img" aria-label="Huyền My"></div></div>

  <div id="lanterns" class="lanterns"></div>

  <div id="veil" role="dialog" aria-label="Chào mừng" data-intro="0">
    <div class="veil-inner">
      <div class="v-char"><div class="hero-slot" aria-hidden="true"></div></div>
      <div class="v-main">
      <p class="greet" aria-live="polite"></p>
      <h1 id="veil-logo"></h1>
      <p class="tag">Soi mình qua thần số, tinh tượng và ngũ hành - <br>cùng một người biết lắng nghe.</p>
      <div id="veil-actions"><button id="enter" class="btn primary">Bước vào</button></div>
      <button type="button" id="veil-login" class="veil-login" hidden>Đã có tài khoản? Đăng nhập để tiếp tục</button>
      <p class="fine">Cuộc trò chuyện được gửi tới trí tuệ nhân tạo để My trả lời. My chỉ lưu hồ sơ của bạn khi bạn đăng ký và đồng ý.</p>
      <p class="copy">© 2026 <b>Lương Việt Hoàng</b>. Bảo lưu mọi quyền. <span class="legal"><a href="/about.html" target="_blank" rel="noopener">Giới thiệu</a> · <a href="/terms.html" target="_blank" rel="noopener">Điều khoản</a> · <a href="/privacy.html" target="_blank" rel="noopener">Quyền riêng tư</a></span></p>
      </div>
    </div>
    <button type="button" id="snd" class="snd" aria-pressed="false">♪ Nhạc nền: tắt</button>
    <button type="button" class="skip-intro" hidden>Chạm để bỏ qua</button>
  </div>

  <header class="topbar">
    <div class="brand" id="brand"></div>
    <div class="tools">
      <span id="demo-badge" class="badge" hidden title="Chưa có ANTHROPIC_API_KEY trên máy chủ">demo</span>
      <span id="clock" class="badge" hidden title="Thời gian còn lại của buổi này"></span>
      <button id="btn-sound" class="icon" aria-label="Nhạc nền" title="Nhạc nền" aria-pressed="false">♪</button>
      <button id="btn-pace" class="icon" aria-label="Nhịp đọc" title="Nhịp đọc">›</button>
      <button id="btn-account" class="icon" hidden aria-label="Tài khoản" title="Tài khoản">☺</button>
      <button id="btn-chart" class="icon" hidden aria-label="Xem lá số" title="Lá số của bạn">☯</button>
      <button id="btn-reset" class="icon" aria-label="Bắt đầu lại" title="Bắt đầu lại">↺</button>
    </div>
  </header>

  <main class="dialog" id="dialog" hidden>
    <div id="log" aria-live="polite"></div>
    <div id="composer"></div>
  </main>

  <aside id="sheet" aria-label="Lá số của bạn" hidden>
    <div class="sheet-card">
      <button id="sheet-close" class="icon close" aria-label="Đóng">×</button>
      <div id="sheet-body"></div>
    </div>
  </aside>

  <script>/* Phòng hờ: nếu mã mở màn không chạy được thì vẫn hiện màn chào đầy đủ */ setTimeout(function () { var v = document.getElementById("veil"); if (v && v.dataset.intro === "0" && !window.__introStarted) { v.dataset.intro = "done"; document.body.classList.add("intro-done"); } }, 5000);</script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
