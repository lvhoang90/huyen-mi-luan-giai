<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Biểu cảm của Huyền My</title>
  <style>
    html { background: #0c0824; } body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 0%, #2a1a66, #0c0824 70%); color: #ece7fb; font-family: system-ui, "Be Vietnam Pro", sans-serif; }
    h1 { font-weight: 500; font-size: 22px; text-align: center; margin: 22px 12px 4px; color: #e2c27d; }
    p.sub { text-align: center; color: #a79fc9; margin: 0 12px 18px; font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; padding: 0 14px 30px; max-width: 1400px; margin: 0 auto; }
    .card { border: 1px solid rgba(190, 170, 255, .22); border-radius: 16px; background: rgba(14, 12, 40, .6); padding: 10px 10px 14px; text-align: center; }
    .card .host { height: 340px; display: flex; justify-content: center; } .card svg { height: 100%; width: auto; }
    .card b { display: block; font-size: 16px; color: #e2c27d; font-weight: 500; margin-top: 4px; } .card span { font-size: 12.5px; color: #a79fc9; }
    .card code { display: block; color: #7d76a6; font-size: 11px; margin-top: 3px; }
  </style>
</head>
<body>
  <h1>Biểu cảm của Huyền My</h1>
  <p class="sub">Mỗi trạng thái gồm mắt, mày, miệng, má, tư thế tay, hướng nhìn và dáng đầu. Di chuột để thấy My nhìn theo ở những trạng thái cho phép.</p>
  <div class="grid" id="grid"></div>
  <script type="module" src="/src/emotions-page.js"></script>
</body>
</html>
